services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: postgres://horilla_user:horilla_pass@db:5432/horilla_db
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD}
      REDIS_URL: redis://:horilla_pass@redis:6379/0
      CELERY_BROKER_URL: redis://:horilla_pass@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:horilla_pass@redis:6379/0
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A horilla worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgres://horilla_user:horilla_pass@db:5432/horilla_db
      REDIS_URL: redis://:horilla_pass@redis:6379/0
      CELERY_BROKER_URL: redis://:horilla_pass@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:horilla_pass@redis:6379/0
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A horilla beat --loglevel=info
    environment:
      DATABASE_URL: postgres://horilla_user:horilla_pass@db:5432/horilla_db
      REDIS_URL: redis://:horilla_pass@redis:6379/0
      CELERY_BROKER_URL: redis://:horilla_pass@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:horilla_pass@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla_user -d horilla_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    profiles:
      - production
    ports:
      - "80:80"
    volumes:
      - staticfiles:/static:ro
      - media:/media:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
